# Test change for Polaris scan

name: Polaris Scan

on:
  pull_request:
  push:

jobs:
  polaris:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Run Black Duck Security Scan
        uses: blackduck-inc/black-duck-security-scan@v2
        with:
          polaris_server_url: ${{ secrets.POLARIS_URL }}
          polaris_access_token: ${{ secrets.POLARIS_TOKEN }}

          polaris_application_name: DRCWebGoat
          polaris_project_name: DRCWebGoat
          polaris_branch_name: ${{ github.ref_name }}

          polaris_assessment_types: "SAST,SCA"

          polaris_waitForScan: true

          github_token: ${{ secrets.GITHUB_TOKEN }}
